[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-reglementation-maroc"
version = "0.1.0"
description = "Evidence-first French and Arabic retrieval over a dated Bank Al-Maghrib banking-law corpus"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "numpy==1.26.4",
    "rank-bm25==0.2.2",
    "pypdf==6.21.0",
]

[project.optional-dependencies]
neural = ["fastembed==0.9.0"]
opensearch = ["opensearch-py==3.2.0"]
dev = ["pytest==8.4.2", "ruff==0.15.11"]
plots = ["matplotlib==3.10.8"]

[project.scripts]
rag-maroc-assistant = "rag_reglementation_assistant.cli:main"
rag-maroc = "rag_reglementation_maroc.cli:main"
rag-maroc-ui = "rag_reglementation_ui.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
rag_reglementation_assistant = ["resources/*.json"]
rag_reglementation_ui = ["static/*", "static/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
